# fly.toml app configuration file generated for giovanni-bonelli-parcel-scout on 2026-04-23T06:12:01-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'giovanni-bonelli-parcel-scout'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[env]
  PARCEL_SCOUT_DATA_DIR = '/app/data'

[[mounts]]
  source = 'parcel_scout_data'
  destination = '/app/data'
  initial_size = '1'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '1m0s'
    method = 'GET'
    path = '/_stcore/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
